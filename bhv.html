<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Wasserverbrauch Rechner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      max-width: 900px;
    }
    h1, h2 {
      margin-bottom: 10px;
    }
    .section {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    label {
      display: block;
      margin-top: 8px;
    }
    input {
      width: 100%;
      padding: 6px;
      margin-top: 3px;
    }
    button {
      padding: 10px 15px;
      cursor: pointer;
      margin-top: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: right;
    }
    th {
      background: #f5f5f5;
    }
    td:first-child, th:first-child {
      text-align: left;
    }
  </style>
</head>

<body>

<h1>Wasserverbrauch Rechner</h1>

<div class="section">
  <h2>Gesamtverbrauch</h2>
  <label>Hauptzähler (m³)</label>
  <input id="total" type="number" value="300">
</div>

<div class="section">
  <h2>Wohnung EG</h2>
  <input id="eg" placeholder="Erfasste Summe EG (WM + Waschbecken etc.)">
</div>

<div class="section">
  <h2>Wohnung OG</h2>
  <input id="og" placeholder="Erfasste Summe OG">
</div>

<div class="section">
  <h2>Wohnung DG</h2>
  <input id="dg" placeholder="Erfasste Summe DG">
</div>

<button onclick="calculate()">Berechnen</button>

<div id="output"></div>

<script>
function calculate() {
  const total = parseFloat(document.getElementById("total").value);
  const EG = parseFloat(document.getElementById("eg").value) || 0;
  const OG = parseFloat(document.getElementById("og").value) || 0;
  const DG = parseFloat(document.getElementById("dg").value) || 0;

  const erfasst = EG + OG + DG;

  if (erfasst === 0) {
    document.getElementById("output").innerHTML =
      "<p>Kein erfasster Verbrauch vorhanden.</p>";
    return;
  }

  const rest = total - erfasst;

  const EG_share = EG / erfasst;
  const OG_share = OG / erfasst;
  const DG_share = DG / erfasst;

  const EG_total = EG + rest * EG_share;
  const OG_total = OG + rest * OG_share;
  const DG_total = DG + rest * DG_share;

  document.getElementById("output").innerHTML = `
    <div class="section">
      <h2>Ergebnis</h2>

      <table>
        <tr>
          <th>Wohnung</th>
          <th>Erfasst</th>
          <th>Rest-Anteil</th>
          <th>Gesamt</th>
        </tr>
        <tr>
          <td>EG</td>
          <td>${EG.toFixed(2)}</td>
          <td>${(rest * EG_share).toFixed(2)}</td>
          <td>${EG_total.toFixed(2)}</td>
        </tr>
        <tr>
          <td>OG</td>
          <td>${OG.toFixed(2)}</td>
          <td>${(rest * OG_share).toFixed(2)}</td>
          <td>${OG_total.toFixed(2)}</td>
        </tr>
        <tr>
          <td>DG</td>
          <td>${DG.toFixed(2)}</td>
          <td>${(rest * DG_share).toFixed(2)}</td>
          <td>${DG_total.toFixed(2)}</td>
        </tr>
        <tr>
          <th>Summe</th>
          <th>${erfasst.toFixed(2)}</th>
          <th>${rest.toFixed(2)}</th>
          <th>${total.toFixed(2)}</th>
        </tr>
      </table>
    </div>
  `;
}
</script>

</body>
</html>
