<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wasserkosten Altbau-Rechner</title>

<style>

/* =========================
   THEME
========================= */

:root{
    --bg: #ffffff;
    --text: #111111;
    --border: #b5b5b5;
    --table-bg: #ffffff;
    --input-bg: #ffffff;
    --accent: #2b6cb0;
}

@media (prefers-color-scheme: dark){
    :root{
        --bg: #121212;
        --text: #eaeaea;
        --border: #3a3a3a;
        --table-bg: #1e1e1e;
        --input-bg: #2a2a2a;
        --accent: #63b3ed;
    }
}

/* =========================
   BASE
========================= */

body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: auto;
    background: var(--bg);
    color: var(--text);
    padding: 10px;
}

h1,h2{
    color: var(--text);
}

/* =========================
   TABLE
========================= */

table{
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 20px;
    background: var(--table-bg);
}

th,td{
    border: 1px solid var(--border);
    padding: 6px;
}

/* =========================
   INPUTS
========================= */

input{
    width: 110px;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--input-bg);
    color: var(--text);
    box-sizing: border-box;
}

input:focus{
    outline: 2px solid var(--accent);
    outline-offset: 1px;
}

/* =========================
   BUTTON
========================= */

button{
    padding: 10px 18px;
    margin-top: 10px;
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 4px;
}

button:hover{
    opacity: 0.9;
}

/* =========================
   RESULT
========================= */

.result{
    margin-top: 20px;
}

</style>
</head>

<body>

<h1>Wasserkostenverteilung (Altbau – Modell)</h1>

<h2>Kosten</h2>
<table>
<tr>
<td>Kaltwasser (€)</td>
<td><input id="costCold" type="number"></td>
</tr>
<tr>
<td>Abwasser (€)</td>
<td><input id="costWaste" type="number"></td>
</tr>
<tr>
<td>Hauswasser gesamt (m³)</td>
<td><input id="houseTotal" type="number" step="0.001"></td>
</tr>
</table>

<h2>Gemessene Verbräuche (m³)</h2>

<table>
<tr><th>Zähler</th><th>EG</th><th>OG</th><th>DG</th></tr>

<tr>
<td>Waschmaschine</td>
<td><input id="wmEG"></td>
<td><input id="wmOG"></td>
<td><input id="wmDG"></td>
</tr>

<tr>
<td>Waschbecken kalt</td>
<td><input id="wbkEG"></td>
<td><input id="wbkOG"></td>
<td><input id="wbkDG"></td>
</tr>

<tr>
<td>Waschbecken warm</td>
<td><input id="wbwEG"></td>
<td><input id="wbwOG"></td>
<td><input id="wbwDG"></td>
</tr>

<tr>
<td>Spüle kalt</td>
<td>-</td>
<td><input id="skOG"></td>
<td><input id="skDG"></td>
</tr>

<tr>
<td>Spüle warm</td>
<td>-</td>
<td><input id="swOG"></td>
<td><input id="swDG"></td>
</tr>

</table>

<h2>Anwesenheitstage</h2>
<table>
<tr>
<th>EG</th><th>OG</th><th>DG</th>
</tr>
<tr>
<td><input id="dEG" value="30"></td>
<td><input id="dOG" value="10"></td>
<td><input id="dDG" value="30"></td>
</tr>
</table>

<button onclick="calc()">Berechnen</button>

<div class="result" id="out"></div>

<script>

function v(id){
    return parseFloat(document.getElementById(id).value)||0;
}

function calc(){

let dEG = v("dEG");
let dOG = v("dOG");
let dDG = v("dDG");

/* =========================
   GEMESSENE VERBRÄUCHE
========================= */

let EG =
v("wmEG") + v("wbkEG") + v("wbwEG");

let OG =
v("wmOG") + v("wbkOG") + v("wbwOG") + v("skOG") + v("swOG");

let DG =
v("wmDG") + v("wbkDG") + v("wbwDG") + v("skDG") + v("swDG");

/* =========================
   SPÜLE EG SCHÄTZEN
========================= */

let ogSink = v("skOG") + v("swOG");
let dgSink = v("skDG") + v("swDG");

let ogDaily = dOG ? ogSink / dOG : 0;
let dgDaily = dDG ? dgSink / dDG : 0;

let egDaily = (ogDaily + dgDaily) / 2;
let egSink = egDaily * dEG;

EG += egSink;

/* =========================
   RESTVERBRAUCH
========================= */

let house = v("houseTotal");

let measured = EG + OG + DG;

let rest = house - measured;
if(rest < 0) rest = 0;

/* =========================
   VERTEILUNG REST
========================= */

let sumDays = dEG + dOG + dDG;

EG += rest * (dEG / sumDays);
OG += rest * (dOG / sumDays);
DG += rest * (dDG / sumDays);

/* =========================
   KOSTEN
========================= */

let totalCost = v("costCold") + v("costWaste");

let total = EG + OG + DG;

let cEG = totalCost * EG / total;
let cOG = totalCost * OG / total;
let cDG = totalCost * DG / total;

/* =========================
   OUTPUT
========================= */

document.getElementById("out").innerHTML = `
<h2>Ergebnis</h2>

<table>
<tr><th>Wohnung</th><th>Verbrauch (m³)</th><th>Kosten (€)</th></tr>
<tr><td>EG</td><td>${EG.toFixed(2)}</td><td>${cEG.toFixed(2)}</td></tr>
<tr><td>OG</td><td>${OG.toFixed(2)}</td><td>${cOG.toFixed(2)}</td></tr>
<tr><td>DG</td><td>${DG.toFixed(2)}</td><td>${cDG.toFixed(2)}</td></tr>
</table>

<p><b>Restverbrauch:</b> ${rest.toFixed(2)} m³</p>
<p><b>EG Spüle geschätzt:</b> ${egSink.toFixed(2)} m³</p>
`;
}

</script>

</body>
</html>
