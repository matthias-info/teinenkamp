<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wasserkosten Altbau-Rechner</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: auto;
}
table{
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 20px;
}
th,td{
    border: 1px solid #ccc;
    padding: 6px;
}
input{
    width: 90px;
}
button{
    padding: 10px 20px;
    margin-top: 10px;
}
.result{
    margin-top: 20px;
}
</style>

</head>

<body>

<h1>Wasserkostenverteilung (Altbau – fair Modell)</h1>

<h2>Kosten</h2>
<table>
<tr>
<td>Kaltwasserkosten (€)</td>
<td><input id="costCold" type="number"></td>
</tr>
<tr>
<td>Abwasserkosten (€)</td>
<td><input id="costWaste" type="number"></td>
</tr>
<tr>
<td>Hauswasser gesamt (m³)</td>
<td><input id="houseTotal" type="number" step="0.001"></td>
</tr>
</table>

<h2>Gemessene Verbräuche (m³)</h2>

<table>
<tr><th>Zähler</th><th>EG</th><th>OG</th><th>DG</th></tr>

<tr>
<td>Waschmaschine</td>
<td><input id="wmEG"></td>
<td><input id="wmOG"></td>
<td><input id="wmDG"></td>
</tr>

<tr>
<td>Waschbecken kalt</td>
<td><input id="wbkEG"></td>
<td><input id="wbkOG"></td>
<td><input id="wbkDG"></td>
</tr>

<tr>
<td>Waschbecken warm</td>
<td><input id="wbwEG"></td>
<td><input id="wbwOG"></td>
<td><input id="wbwDG"></td>
</tr>

<tr>
<td>Spüle kalt</td>
<td>-</td>
<td><input id="skOG"></td>
<td><input id="skDG"></td>
</tr>

<tr>
<td>Spüle warm</td>
<td>-</td>
<td><input id="swOG"></td>
<td><input id="swDG"></td>
</tr>

</table>

<h2>Anwesenheitstage</h2>
<table>
<tr>
<th>EG</th><th>OG</th><th>DG</th>
</tr>
<tr>
<td><input id="dEG" value="30"></td>
<td><input id="dOG" value="10"></td>
<td><input id="dDG" value="30"></td>
</tr>
</table>

<button onclick="calc()">Berechnen</button>

<div class="result" id="out"></div>

<script>

function v(id){
    return parseFloat(document.getElementById(id).value)||0;
}

function calc(){

// Tage
let dEG = v("dEG");
let dOG = v("dOG");
let dDG = v("dDG");

// ----------------------
// GEMESSENE VERBRÄUCHE
// ----------------------
let EG =
v("wmEG") + v("wbkEG") + v("wbwEG");

let OG =
v("wmOG") + v("wbkOG") + v("wbwOG") + v("skOG") + v("swOG");

let DG =
v("wmDG") + v("wbkDG") + v("wbwDG") + v("skDG") + v("swDG");

// ----------------------
// SPÜLE EG SCHÄTZEN
// ----------------------

// Tagesverbrauch OG / DG
let ogSink = v("skOG") + v("swOG");
let dgSink = v("skDG") + v("swDG");

let ogDaily = dOG > 0 ? ogSink / dOG : 0;
let dgDaily = dDG > 0 ? dgSink / dDG : 0;

// Mittelwert pro Tag
let egDaily = (ogDaily + dgDaily) / 2;

// hochrechnen auf EG Tage
let egSinkEstimated = egDaily * dEG;

// EG bekommt geschätzte Spüle dazu
EG += egSinkEstimated;

// ----------------------
// RESTVERBRAUCH
// ----------------------

let house = v("houseTotal");

let measuredSum = EG + OG + DG;

let rest = house - measuredSum;
if(rest < 0) rest = 0;

// ----------------------
// ANWESENHEIT GEWICHT
// ----------------------

let wEG = dEG;
let wOG = dOG;
let wDG = dDG;

let wSum = wEG + wOG + wDG;

// Restverteilung
EG += rest * (wEG / wSum);
OG += rest * (wOG / wSum);
DG += rest * (wDG / wSum);

// ----------------------
// KOSTEN
// ----------------------

let costCold = v("costCold");
let costWaste = v("costWaste");

let totalCost = costCold + costWaste;

let total = EG + OG + DG;

let cEG = totalCost * EG / total;
let cOG = totalCost * OG / total;
let cDG = totalCost * DG / total;

// ----------------------
// OUTPUT
// ----------------------

document.getElementById("out").innerHTML = `
<h2>Ergebnis</h2>

<table>
<tr>
<th>Wohnung</th>
<th>Verbrauch (m³)</th>
<th>Kosten (€)</th>
</tr>

<tr>
<td>EG</td>
<td>${EG.toFixed(2)}</td>
<td>${cEG.toFixed(2)}</td>
</tr>

<tr>
<td>OG</td>
<td>${OG.toFixed(2)}</td>
<td>${cOG.toFixed(2)}</td>
</tr>

<tr>
<td>DG</td>
<td>${DG.toFixed(2)}</td>
<td>${cDG.toFixed(2)}</td>
</tr>
</table>

<p><b>Hausverbrauch:</b> ${house.toFixed(2)} m³</p>
<p><b>Rest (Dusche/WC etc.):</b> ${rest.toFixed(2)} m³</p>
<p><b>EG Spüle geschätzt:</b> ${egSinkEstimated.toFixed(2)} m³</p>
`;
}

</script>

</body>
</html>
